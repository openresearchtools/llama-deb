name: Repackage llama.cpp Debian builds

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      source_tag:
        description: Ordinary llama.cpp build tag (for example b10453); blank selects latest
        required: false
        type: string
      package_revision:
        description: Debian packaging revision; blank uses packaging/revision
        required: false
        type: string
      force:
        description: Rebuild and replace matching release assets
        required: true
        default: false
        type: boolean

concurrency:
  group: repackage-llama-cpp-debs
  cancel-in-progress: false

permissions:
  contents: write

env:
  SOURCE_REPOSITORY: openresearchtools/llama-cpp-arm64-builds

jobs:
  resolve:
    name: Resolve ordinary upstream release
    runs-on: ubuntu-24.04
    outputs:
      package_revision: ${{ steps.resolve.outputs.package_revision }}
      published_epoch: ${{ steps.resolve.outputs.published_epoch }}
      should_build: ${{ steps.resolve.outputs.should_build }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve source and target assets
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REVISION: ${{ inputs.package_revision }}
          REQUESTED_TAG: ${{ inputs.source_tag }}
          FORCE_REBUILD: ${{ inputs.force }}
        run: |
          set -euo pipefail

          retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi
              if (( attempt < 3 )); then
                sleep $((attempt * 10))
              fi
            done
            return 1
          }

          revision=${REQUESTED_REVISION:-}
          if [[ -z $revision ]]; then
            revision=$(<packaging/revision)
          fi

          tag=${REQUESTED_TAG:-}
          if [[ -n $tag ]]; then
            if [[ ! $tag =~ ^b[0-9]+$ ]]; then
              echo "Only ordinary llama.cpp b<number> releases are supported" >&2
              exit 1
            fi
          else
            tag=$(retry gh release list --repo "$SOURCE_REPOSITORY" --limit 100 \
              --exclude-drafts --exclude-pre-releases --json tagName \
              --jq '[.[] | select(.tagName | test("^b[0-9]+$"))] | max_by(.tagName[1:] | tonumber) | .tagName // empty')
            if [[ -z $tag ]]; then
              echo "No ordinary llama.cpp b<number> release was found" >&2
              exit 1
            fi
          fi

          source_release=$(retry gh release view "$tag" --repo "$SOURCE_REPOSITORY" \
            --json assets,isDraft,isPrerelease,publishedAt,tagName)
          if [[ $(jq -r '.isDraft or .isPrerelease' <<<"$source_release") == true ]]; then
            echo "Source release must be published and non-prerelease: $tag" >&2
            exit 1
          fi

          version=$(scripts/debian-version.sh "$tag" "$revision")
          published_at=$(jq -r '.publishedAt' <<<"$source_release")
          published_epoch=$(date -u -d "$published_at" +%s)

          source_assets=$(jq -r '.assets[].name' <<<"$source_release")
          expected_source_assets=(
            "llama-${tag}-bin-ubuntu-vulkan-x64.tar.gz"
            "llama-${tag}-bin-ubuntu-cuda13-x64.tar.gz"
            "llama-${tag}-bin-debian-trixie-vulkan-arm64.tar.gz"
            "llama-${tag}-bin-debian-trixie-cuda13-arm64.tar.gz"
          )
          for asset in "${expected_source_assets[@]}"; do
            if ! grep -Fxq "$asset" <<<"$source_assets"; then
              echo "Source release $tag is missing $asset" >&2
              exit 1
            fi
          done

          expected_target_assets=(
            "llama-cpp_${version}_amd64.deb"
            "llama-cpp-cuda_${version}_amd64.deb"
            "llama-cpp_${version}_arm64.deb"
            "llama-cpp-cuda_${version}_arm64.deb"
          )
          should_build=true
          if [[ ${FORCE_REBUILD:-false} != true ]] && \
             target_assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
               --json assets --jq '.assets[].name' 2>/dev/null); then
            should_build=false
            for asset in "${expected_target_assets[@]}"; do
              if ! grep -Fxq "$asset" <<<"$target_assets"; then
                should_build=true
              fi
            done
          fi

          {
            echo "package_revision=$revision"
            echo "published_epoch=$published_epoch"
            echo "should_build=$should_build"
            echo "tag=$tag"
            echo "version=$version"
          } >>"$GITHUB_OUTPUT"

          echo "Source tag: $tag"
          echo "Debian version: $version"
          echo "Build required: $should_build"

  build:
    name: Build ${{ matrix.package }} (${{ matrix.architecture }})
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            flavor: vulkan
            package: llama-cpp
            source_asset: llama-${{ needs.resolve.outputs.tag }}-bin-ubuntu-vulkan-x64.tar.gz
          - architecture: amd64
            flavor: cuda
            package: llama-cpp-cuda
            source_asset: llama-${{ needs.resolve.outputs.tag }}-bin-ubuntu-cuda13-x64.tar.gz
          - architecture: arm64
            flavor: vulkan
            package: llama-cpp
            source_asset: llama-${{ needs.resolve.outputs.tag }}-bin-debian-trixie-vulkan-arm64.tar.gz
          - architecture: arm64
            flavor: cuda
            package: llama-cpp-cuda
            source_asset: llama-${{ needs.resolve.outputs.tag }}-bin-debian-trixie-cuda13-arm64.tar.gz
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download source build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rm -f "source/${{ matrix.source_asset }}"
            if gh release download "${{ needs.resolve.outputs.tag }}" \
              --repo "$SOURCE_REPOSITORY" \
              --pattern "${{ matrix.source_asset }}" \
              --dir source; then
              exit 0
            fi
            if (( attempt < 3 )); then
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Build Debian package
        env:
          SOURCE_DATE_EPOCH: ${{ needs.resolve.outputs.published_epoch }}
        run: |
          scripts/build-deb.sh \
            --tag "${{ needs.resolve.outputs.tag }}" \
            --revision "${{ needs.resolve.outputs.package_revision }}" \
            --architecture "${{ matrix.architecture }}" \
            --flavor "${{ matrix.flavor }}" \
            --archive "source/${{ matrix.source_asset }}" \
            --output-dir dist

      - name: Verify metadata, contents, and licenses
        env:
          DEB: dist/${{ matrix.package }}_${{ needs.resolve.outputs.version }}_${{ matrix.architecture }}.deb
          PACKAGE: ${{ matrix.package }}
          SOURCE_ARCHIVE: source/${{ matrix.source_asset }}
          SOURCE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          test "$(dpkg-deb -f "$DEB" Package)" = "$PACKAGE"
          test "$(dpkg-deb -f "$DEB" Version)" = "${{ needs.resolve.outputs.version }}"
          test "$(dpkg-deb -f "$DEB" Architecture)" = "${{ matrix.architecture }}"
          test "$(dpkg-deb -f "$DEB" X-Upstream-Tag)" = "$SOURCE_TAG"

          mkdir verify
          dpkg-deb -x "$DEB" verify
          test -x verify/usr/lib/llama-cpp/llama-cli
          test -x verify/usr/lib/llama-cpp/llama-server
          test -L verify/usr/bin/llama-cli
          test -L verify/usr/bin/llama-server
          tar -xOf "$SOURCE_ARCHIVE" "llama-${SOURCE_TAG}/LICENSE" >upstream-license
          cmp upstream-license verify/usr/lib/llama-cpp/LICENSE
          cmp upstream-license "verify/usr/share/doc/${PACKAGE}/copyright"
          cmp LICENSE "verify/usr/share/doc/${PACKAGE}/copyright.packaging"

      - name: Upload Debian package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.package }}-${{ matrix.architecture }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    name: Publish Debian packages
    needs:
      - resolve
      - build
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Download Debian packages
        uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true

      - name: Create checksums and release notes
        env:
          SOURCE_TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          cd release
          sha256sum ./*.deb >SHA256SUMS
          cat >RELEASE_NOTES.md <<EOF
          Debian packages repackaged from the ordinary llama.cpp **${SOURCE_TAG}** builds.

          <!-- openresearchtools-apt-install:start -->
          ## Install on Debian 13+ or Ubuntu 24.04/26.04+

          Choose one package; the Vulkan and CUDA variants conflict. APT selects
          the matching amd64 or arm64 package automatically.

          ### Vulkan

          First Open Research Tools installation:

          \`\`\`bash
          wget -qO /tmp/keyring.deb https://keyring.openresearchtools.com && sudo apt install -y /tmp/keyring.deb && sudo apt update && sudo apt install -y llama-cpp=${VERSION}
          \`\`\`

          Repository already configured:

          \`\`\`bash
          sudo apt update && sudo apt install -y llama-cpp=${VERSION}
          \`\`\`

          ### CUDA

          Install NVIDIA CUDA 13.x and a compatible NVIDIA driver first. This
          package does not install NVIDIA's package repository.

          First Open Research Tools installation:

          \`\`\`bash
          wget -qO /tmp/keyring.deb https://keyring.openresearchtools.com && sudo apt install -y /tmp/keyring.deb && sudo apt update && sudo apt install -y llama-cpp-cuda=${VERSION}
          \`\`\`

          Repository already configured:

          \`\`\`bash
          sudo apt update && sudo apt install -y llama-cpp-cuda=${VERSION}
          \`\`\`
          <!-- openresearchtools-apt-install:end -->

          - \`llama-cpp_${VERSION}_amd64.deb\`: amd64 CPU variants plus Vulkan
          - \`llama-cpp-cuda_${VERSION}_amd64.deb\`: amd64 CPU variants plus CUDA 13.2
          - \`llama-cpp_${VERSION}_arm64.deb\`: arm64 CPU variants plus Vulkan
          - \`llama-cpp-cuda_${VERSION}_arm64.deb\`: arm64 CPU variants plus CUDA 13.2
          - Debian version: \`${VERSION}\`
          - Source release: https://github.com/${SOURCE_REPOSITORY}/releases/tag/${SOURCE_TAG}

          The upstream llama.cpp license is preserved inside each package at both
          \`/usr/lib/llama-cpp/LICENSE\` and the Debian-standard copyright path.
          EOF

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi
              if (( attempt < 3 )); then
                sleep $((attempt * 10))
              fi
            done
            return 1
          }

          if ! gh release view "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if ! retry gh release create "$SOURCE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "llama.cpp ${SOURCE_TAG} Debian packages"; then
              gh release view "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
            fi
          fi

          retry gh release upload "$SOURCE_TAG" release/*.deb release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
          retry gh release edit "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
            --title "llama.cpp ${SOURCE_TAG} Debian packages" \
            --notes-file release/RELEASE_NOTES.md
