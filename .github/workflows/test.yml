name: Test packaging

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck

      - name: Check shell scripts
        run: shellcheck scripts/*.sh tests/*.sh

      - name: Test package construction and version ordering
        run: tests/test-packaging.sh
